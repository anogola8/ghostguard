{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div style="max-width:380px;margin:60px auto">
  <h1 style="text-align:center;margin-bottom:8px">Sign in</h1>
  <p class="muted" style="text-align:center;margin-bottom:32px">to GhostGuard</p>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" style="width:100%;margin-top:12px;justify-content:center">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
